[package]
name = "desktop-canvas"
version = "0.1.0"
description = "Open-source, local-first desktop productivity canvas"
authors = ["Desktop Canvas Contributors"]
edition = "2021"

[lib]
name = "desktop_canvas_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
